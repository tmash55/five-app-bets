# Minimal Supabase CLI config so `supabase functions deploy` works from here.
# Run `npx supabase link --project-ref <ref>` once the app has a project.
project_id = "called-it"

[functions.delete-account]
verify_jwt = true

[functions.generate-slate]
verify_jwt = true

# Checks the service role key itself, so it also accepts non-JWT secret keys.
[functions.grade-slates]
verify_jwt = false
